<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>404 — Halaman Tidak Ditemukan | Klipin</title>
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#000000" />
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png" />
<style>
/* ===== KLIPIN 404 — CSS mandiri (subset tema, sinkron dgn style.css utama) ===== */
@font-face {
  font-family: "Minecraft";
  src: local("Minecraft"), local("Minecraftia");
  font-display: swap;
}
@font-face {
  font-family: "Press Start 2P";
  src: url("https://fonts.gstatic.com/s/pressstart2p/v15/e3t4euO8T-267oIAQAu6jDQyK3nVivM.woff2") format("woff2");
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}
:root {
  --bg: #111111; --panel: #262626; --panel-dark: #1b1b1b;
  --border-light: #8b8b8b; --border-dark: #090909;
  --text: #f5f5f5; --muted: #bdbdbd;
  --accent: #6b8e23; --accent-text: #1b1b1b;
  --danger: #d94b4b;
  --radius: 1px; --ease: cubic-bezier(0.22,1,0.36,1);
}
[data-theme="hitam"] { --bg:#000000; --panel:#1a1a1a; --panel-dark:#0d0d0d; --border-light:#4d4d4d; --border-dark:#000000; --text:#ffffff; --muted:#9c9c9c; --accent:#6ecb63; --accent-text:#04140a; }
[data-theme="putih"] { --bg:#d8d8d0; --panel:#ececec; --panel-dark:#c7c7bf; --border-light:#ffffff; --border-dark:#8a8a82; --text:#202018; --muted:#55554d; --accent:#3a3a32; --accent-text:#f5f5ee; }
[data-theme="merah"] { --bg:#0d0000; --panel:#2a0808; --panel-dark:#1a0202; --border-light:#8b3a3a; --border-dark:#000000; --text:#f5e6e6; --muted:#c99; --accent:#b22222; --accent-text:#f5f5f5; }
[data-theme="hijau"] { --bg:#0a1408; --panel:#16281a; --panel-dark:#0d1a10; --border-light:#4f7a4a; --border-dark:#05100a; --text:#eaf5e8; --muted:#9fc79a; --accent:#4b8b3b; --accent-text:#0d1a0d; }
[data-theme="biru"]  { --bg:#05121c; --panel:#102436; --panel-dark:#081826; --border-light:#3f6a8a; --border-dark:#010b12; --text:#e6f2f9; --muted:#93b8cc; --accent:#3a8fc7; --accent-text:#04141d; }

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg); color: var(--text);
  font-family: "Press Start 2P", "Minecraft", monospace;
  line-height: 1.6; min-height: 100vh; overflow-x: hidden;
  image-rendering: pixelated;
  transition: background .35s var(--ease), color .35s var(--ease);
}
a { color: inherit; text-decoration: none; }

.navbar { position: sticky; top: 0; z-index: 500; background: var(--panel-dark); border-bottom: 3px solid var(--border-dark); }
.navbar-inner { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; max-width: 1200px; margin: 0 auto; }
.logo { font-size: 16px; letter-spacing: 3px; text-transform: uppercase; display: flex; align-items: center; gap: 10px; }
.logo-block { width: 20px; height: 20px; background: var(--accent); border-top: 2px solid #fff4; border-left: 2px solid #fff4; border-right: 2px solid #0006; border-bottom: 2px solid #0006; }

.panel {
  background: var(--panel);
  border-top: 3px solid var(--border-light); border-left: 3px solid var(--border-light);
  border-right: 3px solid var(--border-dark); border-bottom: 3px solid var(--border-dark);
  border-radius: var(--radius); padding: 24px; position: relative;
}
.pixel-corners { position: relative; }
.pixel-corners::before, .pixel-corners::after { content: ""; position: absolute; width: 8px; height: 8px; background: var(--border-light); }
.pixel-corners::before { top: -3px; left: -3px; }
.pixel-corners::after { bottom: -3px; right: -3px; background: var(--border-dark); }

.pixel-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--panel); color: var(--text); border: none;
  border-top: 3px solid var(--border-light); border-left: 3px solid var(--border-light);
  border-right: 3px solid var(--border-dark); border-bottom: 3px solid var(--border-dark);
  border-radius: var(--radius); padding: 14px 22px; font-size: 12px;
  letter-spacing: 1px; text-transform: uppercase; cursor: pointer;
  transition: filter .15s var(--ease), transform .08s var(--ease); user-select: none;
}
.pixel-btn:hover { filter: brightness(1.18); }
.pixel-btn:active { border-top-color: var(--border-dark); border-left-color: var(--border-dark); border-right-color: var(--border-light); border-bottom-color: var(--border-light); transform: translateY(1px); }
.pixel-btn.primary { background: var(--accent); color: var(--accent-text); }
.pixel-btn.block { width: 100%; }

.page-heading { font-size: 16px; text-transform: uppercase; letter-spacing: 2px; text-shadow: 3px 3px 0 var(--border-dark); }
.page-sub { margin-top: 14px; font-size: 11px; color: var(--muted); letter-spacing: 1px; line-height: 1.9; }

.error-code {
  font-size: clamp(48px, 14vw, 84px); line-height: 1;
  text-shadow: 4px 4px 0 var(--border-dark); color: var(--danger);
  margin-bottom: 18px;
  animation: shake 3.2s ease-in-out infinite;
}
@keyframes shake {
  0%, 92%, 100% { transform: translateX(0); }
  93% { transform: translateX(-3px); }
  94% { transform: translateX(3px); }
  95% { transform: translateX(-2px); }
  96% { transform: translateX(2px); }
  97% { transform: translateX(0); }
}

main {
  min-height: calc(100vh - 80px);
  display: flex; align-items: center; justify-content: center; padding: 20px;
  opacity: 0; transform: translateY(16px);
  animation: revealUp .7s var(--ease) forwards;
}
@keyframes revealUp { to { opacity: 1; transform: translateY(0); } }

.actions { display: flex; flex-direction: column; gap: 10px; margin-top: 26px; }

.footer {
  margin-top: 0; padding: 24px; border-top: 3px solid var(--border-dark);
  text-align: center; font-size: 9px; color: var(--muted); letter-spacing: 1px;
}

::selection { background: var(--accent); color: var(--accent-text); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}
</style>
</head>
<body>
  <header class="navbar">
    <div class="navbar-inner">
      <a href="/" class="logo"><span class="logo-block" aria-hidden="true"></span>KLIPIN</a>
    </div>
  </header>

  <main>
    <div class="panel pixel-corners" style="max-width:460px;text-align:center;padding:36px 28px;">
      <div class="error-code">404</div>
      <h1 class="page-heading">BLOK TIDAK DITEMUKAN</h1>
      <p class="page-sub">
        Sepertinya kamu tersesat di luar peta.<br />
        Halaman yang dicari sudah pindah, dihapus, atau memang tidak pernah ada.
      </p>
      <div class="actions">
        <a href="/" class="pixel-btn primary block">&#8592; KEMBALI KE BERANDA</a>
        <a href="/cara-penggunaan" class="pixel-btn block">CARA PENGGUNAAN</a>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>&copy; 2026 Klipin — Developer by PAJAR.</p>
  </footer>

  <script>
    /* ===== JS mandiri: terapkan tema tersimpan (sinkron dgn situs utama) ===== */
    (function () {
      "use strict";
      var THEME_KEY = "klipin_theme";
      var DEFAULT_THEME = "hitam";
      var VALID_THEMES = ["hitam", "abu", "putih", "merah", "hijau", "biru"];

      var saved = localStorage.getItem(THEME_KEY);
      var theme = VALID_THEMES.indexOf(saved) !== -1 ? saved : DEFAULT_THEME;
      if (!saved) localStorage.setItem(THEME_KEY, DEFAULT_THEME);

      if (theme === "abu") {
        document.documentElement.removeAttribute("data-theme");
      } else {
        document.documentElement.setAttribute("data-theme", theme);
      }
    })();
  </script>
</body>
</html>
